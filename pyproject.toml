[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "castmymovie"
version = "0.3.0"
description = "Get any movie onto your Google TV: pick it, make it cast-ready, cast it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ffmpeg", "chromecast", "google-tv", "vlc", "remux", "video"]
dependencies = ["rich>=13", "questionary>=2", "zeroconf>=0.130"]

[project.scripts]
castmymovie = "castmymovie.cli:main"

[tool.setuptools]
packages = ["castmymovie"]
